function Badge({tone='gray',children,icon,className=''}){
  return <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium leading-5 "+TONE[tone]+" "+className}>

}
function toneFor(status){const m=STATUS_META[status];return m?({ggreen:'green',gyellow:'yellow',gred:'red',gblue:'blue'})[m.c]:'gray';}
function StatusChip({status}){const m=STATUS_META[status]||{ic:'dot'};return <Badge tone={toneFor(status)} icon={m.ic}>{status}</Badge>;}
function Freshness({s}){const t={Current:'green','Review due soon':'yellow',Stale:'yellow',Expired:'red',Superseded:'gray'}[s]||'gray';
  const ic={Current:'check','Review due soon':'clock',Stale:'clock',Expired:'alert',Superseded:'refresh'}[s];
  return <Badge tone={t} icon={ic}>{s}</Badge>;}
function Confidence({v,size='md'}){
  const t=v>=75?'green':v>=55?'yellow':v>0?'red':'gray';
  const barc=v>=75?'#34A853':v>=55?'#FBBC04':v>0?'#EA4335':'#80868B';
  if(size==='sm') return <Badge tone={t} icon="gauge">{v}%</Badge>;
  return <div className="inline-flex items-center gap-2 min-w-[120px]">
    <div className="h-1.5 w-16 rounded-full surf2 overflow-hidden"><div style={{width:v+'%',background:barc}} className="h-full rounded-full"/></div>
    <span className="text-xs font-semibold" style={{color:barc}}>{v}%</span></div>;
}
function Card({children,className='',...r}){return <div className={"card "+className} {...r}>{children}</div>;}
function SectionTitle({children,sub,icon,right}){return <div className="flex items-start justify-between gap-3 mb-3">

function Btn({children,variant='ghost',icon,className='',...r}){

}

  const w=navOpen?'w-60':'w-[68px]';
  return <aside className={"shrink-0 "+w+" transition-all duration-200 border-r brd bg-white dark:bg-[#12161c] hidden md:flex flex-col"}>
    <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto">
      {NAV.map(n=>{const on=route===n.id;return <Tip key={n.id} text={navOpen?'':n.label}>
        <button onClick={()=>setRoute(n.id)} aria-current={on?'page':undefined}
          className={"navlink w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-medium transition "+(on?'bg-gblue/10 text-gblue dark:text-[#8ab4f8]':'text-ink2 dark:text-[#c4c7cc] hover:bg-black/5 dark:hover:bg-white/10')}>
          <Icon n={n.icon} size={19}/>{navOpen&&<span className="truncate">{n.label}</span>}
          {on&&navOpen&&<span className="ml-auto w-1.5 h-1.5 rounded-full bg-gblue"/>}
        </button></Tip>;})}
    </nav>
    <div className="p-2 border-t brd space-y-2 text-[11px] text-ink2 dark:text-[#9aa0a6]">
      {navOpen?<>
        <div className="flex items-center gap-2 px-2"><span className="w-2 h-2 rounded-full bg-ggreen" style={{animation:'pulseDot 1.8s infinite'}}/>System health: Nominal</div>
        <div className="flex items-center gap-2 px-2"><Icon n="filecheck" size={13}/>12 approved documents</div>
        <div className="flex items-center gap-2 px-2"><Icon n="refresh" size={13}/>Ingested 13 Sep, 06:40</div>
        <div className="px-2"><Badge tone="blue">Prototype · Internal use only</Badge></div>
      </>:<div className="flex flex-col items-center gap-3 py-1">
        <Tip text="System health: Nominal"><span className="w-2.5 h-2.5 rounded-full bg-ggreen"/></Tip>
        <Tip text="12 approved documents"><Icon n="filecheck" size={16}/></Tip>
        <Tip text="Prototype · Internal use only"><Icon n="lock" size={16} cls="text-gblue"/></Tip></div>}
    </div>
  </aside>;
}

function MobileNav(){const {route,setRoute}=useApp();
  const items=NAV.slice(0,5);
  return <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-[#12161c] border-t brd flex justify-around px-1 py-1">
    {items.map(n=>{const on=route===n.id;return <button key={n.id} onClick={()=>setRoute(n.id)} className={"flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] "+(on?'text-gblue':'text-ink2')}>
      <Icon n={n.icon} size={20}/>{n.label.split(' ')[0]}</button>;})}
  </nav>;
}

function Disclaimer(){return <div className="flex items-center gap-2 text-[11px] text-ink2 dark:text-[#9aa0a6] px-3 py-1.5 rounded-xl surf2 border brd">
  <Icon n="info" size={13} cls="text-gblue shrink-0"/>
  <span>Internal decision-support prototype. Outputs must be reviewed against approved bank processes. The assistant does not provide personalized investment advice. All data shown is illustrative.</span></div>;}

  'Brief me on the latest approved outlook for European rates',
  'Summarize the approved house view on private credit',
  'What changed in the latest suitability policy?',

  'What risks should I know before discussing structured products?',
];

    else if(key.includes('buy')||key.includes('income fund'))d='q5';
    runDemo(d,text);};
  const quick=[
    {t:'Prepare a client briefing',ic:'sparkles',to:'briefing'},
    {t:'Review market changes',ic:'trending',to:'market'},
    {t:'Check a policy',ic:'filecheck',to:'library'},
    {t:'Compare approved sources',ic:'compare',to:'briefing'},
    {t:'Review low-confidence answers',ic:'gauge',to:'quality'},
  ];
  const priority=[
    {ic:'clock',tone:'yellow',t:'Suitability Policy 2026 review due',s:'Review date 15 Sep · D-09',to:'library'},
    {ic:'compare',tone:'red',t:'Unresolved conflict: EM equities',s:'House View vs Risk note · C-02',to:'risk'},
    {ic:'filecheck',tone:'green',t:'New approved: US Rates Strategy v3.1',s:'Effective 06 Sep · D-04',to:'library'},
    {ic:'shield',tone:'blue',t:'Client Communication Policy stale',s:'Expired 05 Sep · D-11',to:'library'},

  return <div className="space-y-4 fadeUp">
    <Card className="p-6 md:p-7 overflow-hidden relative">
      <div className="absolute -right-16 -top-16 w-64 h-64 rounded-full" style={{background:'radial-gradient(closest-side,rgba(66,133,244,.14),transparent)'}}/>
      <p className="text-[13px] text-gblue font-medium">Good morning, Alex</p>
      <h1 className="text-2xl md:text-[26px] font-semibold tracking-tight mt-1">What do you need before your next client conversation?</h1>
      <div className="mt-4 flex items-center gap-2 h-12 px-3 rounded-2xl border brd bg-white dark:bg-[#171b21] shadow-soft max-w-3xl">
        <Icon n="sparkles" size={18} cls="text-gblue"/>
        <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&q&&go(q)}
          placeholder="Ask across approved sources only…" className="flex-1 bg-transparent outline-none text-[14px] placeholder:text-ink3"/>
        <Btn variant="primary" icon="arrow" onClick={()=>q&&go(q)}>Brief me</Btn>
      </div>
      <div className="mt-3 flex flex-wrap gap-2 max-w-3xl">
        {EXAMPLE_PROMPTS.map((p,i)=><button key={i} onClick={()=>go(p)} className="text-[12px] px-3 py-1.5 rounded-full border brd hover:bg-gblue/8 hover:border-gblue/40 text-ink2 dark:text-[#c4c7cc] transition">{p}</button>)}
      </div>
    </Card>

    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
      {quick.map((c,i)=><button key={i} onClick={()=>setRoute(c.to)} className="card p-4 text-left hover:shadow-pop hover:-translate-y-0.5 transition group">
        <span className="w-9 h-9 rounded-xl bg-gblue/10 text-gblue grid place-items-center mb-6 group-hover:bg-gblue group-hover:text-white transition"><Icon n={c.ic} size={18}/></span>
        <p className="text-[13px] font-medium leading-snug">{c.t}</p>
        <span className="text-[11px] text-gblue flex items-center gap-1 mt-1 opacity-0 group-hover:opacity-100 transition">Open <Icon n="chevr" size={12}/></span>

    <div className="grid lg:grid-cols-3 gap-4">

        <div className="space-y-1.5">

          <div className="bg-ggreen" style={{width:'59%'}}/><div className="bg-gyellow" style={{width:'23%'}}/><div className="bg-gred" style={{width:'12%'}}/><div className="bg-ink3" style={{width:'6%'}}/>

    <Card className="p-5">

      <div className="overflow-x-auto -mx-1">
        <table className="w-full text-[13px] min-w-[820px]">
          <thead><tr className="text-left text-ink3 text-[11px] uppercase tracking-wide border-b brd">

          <tbody>
            {SAMPLE_QUERIES.slice(0,7).map((q,i)=><tr key={i} onClick={()=>setRoute('audit')} className="border-b brd last:border-0 hover:bg-black/[.03] dark:hover:bg-white/5 cursor-pointer">
              <td className="py-2.5 px-2 font-medium max-w-[240px] truncate">{q.prompt}</td>
              <td className="px-2 text-ink2 dark:text-[#9aa0a6]">{q.user}</td>
              <td className="px-2"><StatusChip status={q.status}/></td>
              <td className="px-2"><Confidence v={q.confidence}/></td>
              <td className="px-2">{q.citations}</td>
              <td className="px-2 text-ggreen font-medium">{q.timeSaved} min</td>
              <td className="px-2 text-ink2 dark:text-[#9aa0a6]">{q.feedback}</td>

/* ============================================================
   PAGE 2 — AI BRIEFING WORKSPACE
   ============================================================ */
const STAGES=['Checking access','Searching approved sources','Removing stale evidence','Checking source conflicts','Drafting briefing','Validating claims','Attaching citations','Applying policy controls'];
const SECTION_LABELS={exec:'Executive summary',changed:'What changed',matters:'Why it matters',relevance:'Client relevance',risks:'Key risks and caveats',talking:'Approved talking points',questions:'Questions the RM may ask',followup:'Required follow-up'};

function InlineCite({nums,onCite,active}){
  if(!nums||!nums.length) return null;
  return <>{nums.map(n=><sup key={n} className={"cite "+(active===n?'bg-gyellow/40 rounded':'')} onClick={()=>onCite(n)} title={"Open source ["+n+"]"}>[{n}]</sup>)}</>;
}
function Para({item,onCite,active,highlight}){
  const isHi = highlight && item.c && item.c.includes(highlight);
  return <p className={"text-[13.5px] leading-relaxed transition rounded px-1 -mx-1 "+(isHi?'bg-gyellow/20':'')}>
    {item.t} <InlineCite nums={item.c} onCite={onCite} active={active}/></p>;
}

function BriefContext(){
  const [exclExpired,setExcl]=useState(true);const [showConf,setShowConf]=useState(true);
  const field=(label,val,opts)=><label className="block"><span className="text-[11px] text-ink2 dark:text-[#9aa0a6]">{label}</span>
    <select defaultValue={val} className="mt-1 w-full h-9 px-2.5 rounded-xl border brd bg-white dark:bg-[#171b21] text-[13px] outline-none focus:border-gblue">
      {opts.map(o=><option key={o}>{o}</option>)}</select></label>;
  return <div className="space-y-3">
    <SectionTitle icon="user" sub="Fictional client — illustrative only">Briefing context</SectionTitle>
    <div className="grid grid-cols-2 gap-2.5">
      {field('Client / portfolio','Client A (fictional)',['Client A (fictional)','Client B (fictional)','Portfolio X (fictional)'])}
      {field('Client segment','Private wealth',['Private wealth','Institutional','Commercial'])}
      {field('Geography','Europe',['Europe','US','Emerging Markets','Global'])}
      {field('Relationship objective','Portfolio review',['Portfolio review','New allocation','Risk check','Reporting'])}
      {field('Asset class','Fixed Income',['Fixed Income','Rates','Equities','Private Markets','FX','Multi-asset'])}
      {field('Risk profile','Balanced',['Conservative','Balanced','Growth'])}
      {field('Briefing type','Pre-meeting',['Pre-meeting','Market update','Policy check','Comparison'])}
      {field('Output length','Standard',['Concise','Standard','Detailed'])}
    </div>
    <label className="block"><span className="text-[11px] text-ink2 dark:text-[#9aa0a6]">As-of date</span>
      <input type="date" defaultValue="2026-09-13" className="mt-1 w-full h-9 px-2.5 rounded-xl border brd bg-white dark:bg-[#171b21] text-[13px] outline-none focus:border-gblue"/></label>
    <div><span className="text-[11px] text-ink2 dark:text-[#9aa0a6]">Approved source collections</span>
      <div className="flex flex-wrap gap-1.5 mt-1.5">{['House View','Market Outlook','Investment Strategy','Suitability Policy','Risk Guidance'].map(c=>
        <Badge key={c} tone="blue" icon="check">{c}</Badge>)}</div></div>
    <div className="pt-2 border-t brd space-y-2.5">
      <Toggle on={exclExpired} set={setExcl} label="Exclude expired documents"/>
      <Toggle on={showConf} set={setShowConf} label="Show conflicting sources"/>
    </div>
  </div>;
}

function Processing({stage}){
  return <div className="card p-5 fadeUp">
    <div className="flex items-center gap-2 mb-4"><span className="w-2 h-2 rounded-full bg-gblue" style={{animation:'pulseDot 1s infinite'}}/>
      <span className="text-[13px] font-medium">Generating evidence-grounded briefing…</span></div>
    <div className="space-y-2">
      {STAGES.map((s,i)=>{const done=i<stage,cur=i===stage;
        return <div key={i} className={"flex items-center gap-3 text-[13px] "+(done?'text-ink':cur?'text-gblue font-medium':'text-ink3')}>
          <span className={"w-5 h-5 rounded-full grid place-items-center "+(done?'bg-ggreen text-white':cur?'bg-gblue/15 text-gblue':'surf2 text-ink3')}>
            {done?<Icon n="check" size={12}/>:cur?<span className="w-2 h-2 rounded-full bg-gblue" style={{animation:'pulseDot 1s infinite'}}/>:<span className="w-1.5 h-1.5 rounded-full bg-ink3"/>}</span>
          {s}{cur&&<span className="ml-auto"><Skeleton className="h-2 w-24"/></span>}</div>;})}
    </div>
  </div>;
}

function ActionBar(){
  const acts=[['Save briefing','download','tonal'],['Copy with citations','copy','ghost'],['Export to PDF','filecheck','ghost'],
    ['Add to client prep','plus','ghost'],['Request specialist review','usercheck','ghost'],['Mark for compliance','flag','ghost'],['Rate answer','star','ghost'],['Report unsupported claim','alert','danger']];
  const [rated,setRated]=useState(0);const [msg,setMsg]=useState('');
  return <div className="card p-3">
    {msg&&<div className="mb-2 text-[12px] text-ggreen flex items-center gap-1.5"><Icon n="check" size={13}/>{msg} · logged as audit event</div>}
    <div className="flex flex-wrap gap-1.5 items-center">
      {acts.map(([t,ic,v])=><Btn key={t} icon={ic} variant={v} onClick={()=>setMsg(t)}>{t}</Btn>)}
      <div className="ml-auto flex items-center gap-0.5 pl-2">{[1,2,3,4,5].map(s=>
        <button key={s} onClick={()=>{setRated(s);setMsg('Rated '+s+'/5')}} className="p-0.5"><Icon n="star" size={16} cls={s<=rated?'text-gyellow':'text-ink3'} style={s<=rated?{fill:'#FBBC04'}:{}}/></button>)}</div>
    </div>
  </div>;
}

function RestrictedState({b,onCite,active}){
  return <div className="card border-gred/40 overflow-hidden fadeUp">
    <div className="bg-gred/8 px-5 py-3 flex items-center gap-2 border-b border-gred/20"><Icon n="ban" cls="text-gred"/>
      <span className="font-semibold text-[14px] text-gred">Policy-restricted response</span>
      <Badge tone="red" className="ml-auto">Control: {b.control}</Badge></div>
    <div className="p-5 space-y-4">
      <p className="text-[13.5px] leading-relaxed">{b.explanation}</p>
      <div><h4 className="text-[12px] font-semibold text-ink2 dark:text-[#9aa0a6] uppercase tracking-wide mb-1.5">Relevant approved product facts</h4>
        {b.productFacts.map((f,i)=><Para key={i} item={f} onCite={onCite} active={active}/>)}</div>
      <div><h4 className="text-[12px] font-semibold text-ink2 dark:text-[#9aa0a6] uppercase tracking-wide mb-1.5">Suitability factors to verify</h4>
        <ul className="text-[13.5px] space-y-1 list-disc pl-5">{b.suitability.map((s,i)=><li key={i}>{s}</li>)}</ul></div>
      <div><h4 className="text-[12px] font-semibold text-ink2 dark:text-[#9aa0a6] uppercase tracking-wide mb-1.5">Risks and caveats</h4>
        {b.risks.map((f,i)=><Para key={i} item={f} onCite={onCite} active={active}/>)}</div>
      <div className="surf2 rounded-xl p-3"><h4 className="text-[12px] font-semibold mb-1.5 flex items-center gap-1.5"><Icon n="route" size={14} cls="text-gblue"/>Required bank process</h4>
        <ol className="text-[13px] space-y-1 list-decimal pl-5">{b.process.map((s,i)=><li key={i}>{s}</li>)}</ol></div>
      <Btn variant="primary" icon="usercheck">Request authorised specialist / compliance review</Btn>
    </div>
  </div>;
}

function AbstainState({b}){
  return <div className="card border-gyellow/50 overflow-hidden fadeUp">
    <div className="bg-gyellow/12 px-5 py-3 flex items-center gap-2 border-b border-gyellow/30"><Icon n="searchx" cls="text-[#9a6a00]"/>
      <span className="font-semibold text-[14px]">Insufficient evidence — the assistant abstained</span>
      <Badge tone="yellow" className="ml-auto">Abstention event recorded</Badge></div>
    <div className="p-5 space-y-4">
      <p className="text-[14px] font-medium">“I could not establish this from the currently approved document set.”</p>
      <div className="grid sm:grid-cols-2 gap-4">
        <div><h4 className="text-[12px] font-semibold text-ggreen uppercase tracking-wide mb-1.5">What could be established</h4>
          <ul className="text-[13px] space-y-1 list-disc pl-5">{b.established.map((s,i)=><li key={i}>{s}</li>)}</ul></div>
        <div><h4 className="text-[12px] font-semibold text-gred uppercase tracking-wide mb-1.5">What could not be established</h4>
          <ul className="text-[13px] space-y-1 list-disc pl-5">{b.notEstablished.map((s,i)=><li key={i}>{s}</li>)}</ul></div>
      </div>
      <div><h4 className="text-[12px] font-semibold text-ink2 dark:text-[#9aa0a6] uppercase tracking-wide mb-1.5">Missing evidence</h4>
        <div className="flex flex-wrap gap-1.5">{b.missing.map((m,i)=><Badge key={i} tone="gray" icon="filecheck">{m}</Badge>)}</div></div>
      <div className="surf2 rounded-xl p-3 flex items-start gap-2"><Icon n="info" size={15} cls="text-gblue mt-0.5"/>
        <span className="text-[13px]"><b>Suggested safer reformulation:</b> {b.saferPrompt}</span></div>
      <Btn variant="primary" icon="usercheck">Request specialist review</Btn>
    </div>
  </div>;
}

function BriefingRenderer({b,onCite,active,highlight}){
  if(b.restricted) return <RestrictedState b={b} onCite={onCite} active={active}/>;
  if(b.abstain) return <AbstainState b={b}/>;
  const order=['exec','changed','matters','relevance','risks','talking','questions','followup'];
  return <div className="card p-5 fadeUp">
    <div className="space-y-5">
      {order.map((k,idx)=>b.sections[k]&&<div key={k}>
        <h3 className="text-[12px] font-semibold text-gblue uppercase tracking-wide mb-1.5 flex items-center gap-1.5">
          <span className="w-4 h-4 rounded grid place-items-center bg-gblue/10 text-[10px]">{idx+1}</span>{SECTION_LABELS[k]}</h3>
        <div className="space-y-1.5">{b.sections[k].map((it,i)=><Para key={i} item={it} onCite={onCite} active={active} highlight={highlight}/>)}</div>
      </div>)}
      <div className="pt-3 border-t brd">
        <h3 className="text-[12px] font-semibold text-gblue uppercase tracking-wide mb-2">Sources and effective dates</h3>
        <div className="grid sm:grid-cols-2 gap-2">{b.citations.map(c=>{const d=docById(c.docId);return d&&
          <button key={c.n} onClick={()=>onCite(c.n)} className="flex items-center gap-2 text-left p-2 rounded-lg border brd hover:border-gblue/40 hover:bg-gblue/5">
            <span className="w-5 h-5 rounded bg-gblue/10 text-gblue grid place-items-center text-[11px] font-bold shrink-0">{c.n}</span>
            <span className="min-w-0"><span className="block text-[12px] font-medium truncate">{d.title}</span>
            <span className="block text-[10px] text-ink3">Effective {d.effectiveDate} · {c.page}</span></span>
            {c.stale&&<Badge tone="yellow">stale</Badge>}</button>;})}</div>
      </div>
    </div>
  </div>;
}

/* ---- Evidence drawer ---- */
function SourceCardRow({c,expanded,onToggle,onCite}){
  const d=docById(c.docId);if(!d)return null;
  return <div className="border brd rounded-xl overflow-hidden">
    <button onClick={onToggle} className="w-full flex items-center gap-2.5 p-2.5 text-left hover:bg-black/[.03] dark:hover:bg-white/5">
      <span className="w-6 h-6 rounded-lg bg-gblue/10 text-gblue grid place-items-center text-[11px] font-bold shrink-0">{c.n}</span>
      <span className="min-w-0 flex-1"><span className="block text-[12.5px] font-medium truncate">{d.title}</span>
        <span className="flex items-center gap-1.5 mt-0.5"><Badge tone="blue">{d.category}</Badge><Freshness s={d.freshnessStatus}/></span></span>
      <span className="text-right shrink-0"><span className="block text-[10px] text-ink3">rel {(c.rel*100).toFixed(0)}%</span><Icon n={expanded?'chevd':'chevr'} size={14} cls="text-ink3"/></span>
    </button>
    {expanded&&<div className="px-3 pb-3 pt-1 text-[12px] space-y-1.5 fadeUp border-t brd surf2">
      <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-ink2 dark:text-[#9aa0a6] pt-2">
        <span>Owner: <b className="text-ink dark:text-[#e8eaed]">{d.owner}</b></span><span>Approval: <b className="text-ink dark:text-[#e8eaed]">{d.approvalStatus}</b></span>
        <span>Published: {d.publicationDate}</span><span>Effective: {d.effectiveDate}</span>
        <span>Review: {d.reviewDate}</span><span>Expiry: {d.expiryDate}</span>
        <span>Version: {d.version}</span><span>{c.page} · {c.section}</span></div>
      <div className="bg-white dark:bg-[#12161c] rounded-lg p-2 border brd"><span className="text-[10px] text-ink3">Supporting excerpt</span>
        <p className="italic text-ink dark:text-[#e8eaed] mt-0.5">“{c.excerpt}”</p></div>
      <Btn variant="ghost" icon="ext" onClick={()=>onCite(c.n)}>Highlight in briefing</Btn>
    </div>}
  </div>;
}

function PageBriefing(){

              <span className="absolute -left-6 top-0.5 w-4 h-4 rounded-full bg-gblue/15 text-gblue grid place-items-center text-[9px] font-bold">{i+1}</span>
              {i<AUDIT_CHAIN.length-1&&<span className="absolute -left-[17px] top-4 bottom-0 w-px bg-divid dark:bg-[#262b33]"/>}
              <p className="text-[12.5px] font-medium">{s}</p>
              <p className="text-[10px] text-ink3">{sel.ts.replace('T',' ')} · ok</p></div>)}
          </div>
          <div className="flex gap-1.5">{['CSV','JSON'].map(f=><Btn key={f} variant="outline" icon="download">{f}</Btn>)}</div>
        </div></div></div>}
  </div>;
}

/* ============================================================
   PAGE 9 — SETTINGS AND GOVERNANCE
   ============================================================ */
function SettingGroup({icon,title,items}){return <Card className="p-5">
  <SectionTitle icon={icon}>{title}</SectionTitle>
  <div className="space-y-3">{items.map((it,i)=><div key={i} className="flex items-center justify-between gap-3">
    <div><p className="text-[13px] font-medium">{it[0]}</p>{it[2]&&<p className="text-[11px] text-ink3">{it[2]}</p>}</div>
    <span className="text-[12px]">{it[1]}</span></div>)}</div></Card>;}
function Slider({v}){return <span className="inline-flex items-center gap-2"><span className="w-24 h-1.5 surf2 rounded-full relative"><span className="absolute inset-y-0 left-0 bg-gblue rounded-full" style={{width:v}}/></span></span>;}
function PageSettings(){
  const [k,setK]=useState('55%');
  return <div className="space-y-4 fadeUp">
    <SectionTitle icon="settings" sub="Configurable prototype settings — illustrative only">Settings and governance</SectionTitle>
    <div className="grid lg:grid-cols-2 gap-4">
      <SettingGroup icon="db" title="Knowledge" items={[
        ['Active source collections','5 selected'],['Allowed document types','8 types'],['Freshness thresholds','Review 60d / Expire 90d'],['Document hierarchy','House View > Strategy > Note'],['Metadata requirements','Effective + Review dates']]}/>
      <SettingGroup icon="search" title="Retrieval" items={[
        ['Top-k passages',<Slider v="60%"/>,'Currently 8'],['Minimum reranking score',<Slider v="70%"/>,'0.70'],['Diversity setting',<Slider v="40%"/>],['Exact-match boost','On'],['Effective-date weighting','High']]}/>
      <SettingGroup icon="filecheck" title="Answer" items={[
        ['Standard briefing length','Standard'],['Maximum unsupported statements','0'],['Minimum citation coverage','90%'],['Confidence threshold',<Slider v="55%"/>,'55%'],['Abstention threshold',<Slider v="40%"/>,'40%']]}/>
      <SettingGroup icon="shield" title="Controls" items={[
        ['Investment recommendation detection','On'],['Stale-content restriction','On'],['Restricted-content handling','Entitlement check'],['Conflict escalation','Specialist review'],['Mandatory specialist review','Conflicts, Restricted']]}/>
    </div>
    <SettingGroup icon="lock" title="Governance" items={[
      ['Prompt version','pv-2026.09'],['Model version','brief-orch-v1.4'],['Test-set version','ts-2026.08'],['Last evaluation date','12 Sep 2026'],['Designated control owner','Risk & Controls team'],['Designated document owner','Knowledge Management']]}/>
  </div>;
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [dark,setDark]=useState(false);
  const [navOpen,setNavOpen]=useState(true);
  const [ds,setDs]=useState('Global Wealth — Approved');
  const [currentDemo,setCurrentDemo]=useState('q1');
  const [pending,setPending]=useState(false);
  const [drawerOpen,setDrawerOpen]=useState(false);
  const mainRef=useRef();

  useEffect(()=>{document.documentElement.classList.toggle('dark',dark);},[dark]);
  useEffect(()=>{if(mainRef.current)mainRef.current.scrollTo(0,0);},[route]);

  const runDemo=(key,promptText)=>{
    setCurrentDemo(key);
    if(promptText&&BRIEFINGS[key])BRIEFINGS[key].prompt=promptText;
    setRoute('briefing');setPending(true);setDrawerOpen(false);
  };

  const PAGES={home:PageHome,briefing:PageBriefing,market:PageMarket,library:PageLibrary,risk:PageRisk,quality:PageQuality,feedback:PageFeedback,audit:PageAudit,settings:PageSettings};
  const Page=PAGES[route]||PageHome;

  const ctx={route,setRoute,dark,setDark,navOpen,setNavOpen,ds,setDs,currentDemo,setCurrentDemo,pending,setPending,runDemo,drawerOpen,setDrawerOpen};

  return <AppCtx.Provider value={ctx}>
    <div className="h-full flex flex-col">
      <TopBar/>
      <div className="flex-1 flex min-h-0">
        <NavRail/>
        <main ref={mainRef} className="flex-1 overflow-y-auto pb-20 md:pb-6">
          <div className="max-w-[1440px] mx-auto p-3 md:p-5 space-y-4">
            <Disclaimer/>
            {route!=='briefing'&&<TrustBar/>}
            <Page/>
          </div>
        </main>
      </div>
      <MobileNav/>
    </div>
  </AppCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
