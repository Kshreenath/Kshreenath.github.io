<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strategic Command Center — Chief of Staff</title>
<style>
/* ============================================================
   Strategic Command Center — HSBC-themed Chief of Staff system
   Self-contained prototype. Fictional demonstration data only.
   ============================================================ */
:root{
  /* HSBC brand */
  --hsbc-red:#DB0011;
  --hsbc-red-dark:#A80009;
  /* status / accent system */
  --blue:#4285F4;
  --decision-blue:#0A66C2;
  --green:#34A853;
  --amber:#FBBC05;
  --red:#EA4335;
  --purple:#7C4DFF;
  --ink:#1D1D1F;
  --ink2:#5F6368;
  --canvas:#F4F7FB;
  --glass:rgba(255,255,255,0.70);
  --glass-strong:rgba(255,255,255,0.85);
  --border:rgba(20,30,50,0.10);
  --shadow:0 8px 30px rgba(20,30,50,0.10);
  --radius:14px;
  font-synthesis:none;
}
html[data-mode="dark"]{
  --canvas:#0d1117;
  --glass:rgba(30,36,48,0.62);
  --glass-strong:rgba(30,36,48,0.85);
  --ink:#F2F4F8;
  --ink2:#A9B2C3;
  --border:rgba(255,255,255,0.10);
  --shadow:0 8px 30px rgba(0,0,0,0.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--canvas);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums}
/* aurora backdrop */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28}
.aurora .a1{width:520px;height:520px;background:var(--hsbc-red);top:-140px;right:-80px}
.aurora .a2{width:480px;height:480px;background:var(--blue);bottom:-160px;left:120px;opacity:.20}
.aurora .a3{width:420px;height:420px;background:var(--purple);top:40%;left:45%;opacity:.14}
html[data-mode="dark"] .aurora span{opacity:.20}

/* layout */
.app{position:relative;z-index:1;display:grid;grid-template-columns:238px 1fr;grid-template-rows:auto 1fr;height:100vh}
header.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--glass-strong);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.hex{width:26px;height:26px;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink2);font-size:11px;letter-spacing:.3px}
.top .sel,.top input,.top button{font-family:inherit;font-size:12.5px;color:var(--ink)}
.top .sel{background:var(--glass);border:1px solid var(--border);border-radius:9px;padding:6px 8px;cursor:pointer}
.top .spacer{flex:1}
.searchbox{position:relative}
.searchbox input{background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:7px 12px 7px 30px;width:190px;outline:none}
.searchbox svg{position:absolute;left:9px;top:8px;opacity:.5}
.search-results{position:absolute;top:38px;left:0;width:340px;max-height:400px;overflow:auto;background:var(--glass-strong);
  backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:50;display:none}
.search-results.show{display:block}
.search-results .grp{padding:6px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);background:rgba(0,0,0,.03)}
.search-results .row{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-results .row:hover{background:rgba(66,133,244,.12)}
.iconbtn{background:var(--glass);border:1px solid var(--border);border-radius:9px;width:34px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--hsbc-red)}
.btn{background:var(--hsbc-red);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:12.5px}
.btn.alt{background:var(--decision-blue)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--border)}
.freshness{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.freshness .fdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:20px;background:var(--glass);border:1px solid var(--border)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--hsbc-red),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* nav */
nav.side{background:var(--glass);backdrop-filter:blur(18px);border-right:1px solid var(--border);padding:12px 10px;overflow:auto}
nav.side .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:500;margin-bottom:2px;font-size:13px}
nav.side .navitem:hover{background:rgba(66,133,244,.10);color:var(--ink)}
nav.side .navitem.active{background:linear-gradient(135deg,rgba(219,0,17,.14),rgba(124,77,255,.10));color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
nav.side .navitem .ni{width:18px;text-align:center;font-size:15px}
nav.side .navitem .badge{margin-left:auto;background:var(--hsbc-red);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-weight:700}
nav .sectlabel{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink2);padding:12px 11px 4px}

/* main */
main{overflow:auto;padding:0}
.filterbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 22px;
  background:var(--glass-strong);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.filterbar select{font-family:inherit;font-size:12px;color:var(--ink);background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:5px 7px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(66,133,244,.14);border:1px solid rgba(66,133,244,.3);color:var(--ink);border-radius:16px;padding:3px 9px;font-size:11.5px}
.chip b{font-weight:600}.chip .x{cursor:pointer;opacity:.6}
.clearall{font-size:11.5px;color:var(--decision-blue);cursor:pointer;font-weight:600}
.page{padding:20px 22px 60px;max-width:1500px}
h1.pt{font-size:22px;margin:2px 0 2px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--ink2);margin:0 0 16px;font-size:13px}
.section-h{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
html[data-mode="dark"] .card::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{padding:14px 16px}
.kpi .lbl{font-size:11.5px;color:var(--ink2);font-weight:500}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .meta{font-size:11px;color:var(--ink2);margin-top:2px}
.kpi .val.small{font-size:19px}
/* badges */
.badge-status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-status .sd{width:8px;height:8px;border-radius:50%}
.s-ontrack{background:rgba(52,168,83,.15);color:#177a34}.s-ontrack .sd{background:var(--green)}
.s-attention{background:rgba(251,188,5,.18);color:#8a6d00}.s-attention .sd{background:var(--amber)}
.s-risk{background:rgba(234,67,53,.13);color:#b31c10}.s-risk .sd{background:var(--red)}
.s-critical{background:rgba(234,67,53,.22);color:#a1160b}.s-critical .sd{background:var(--red)}
.s-complete{background:rgba(10,102,194,.13);color:#084b8f}.s-complete .sd{background:var(--decision-blue)}
.s-notstarted,.s-hold{background:rgba(95,99,104,.15);color:#4a4e53}.s-notstarted .sd,.s-hold .sd{background:var(--ink2)}
html[data-mode="dark"] .s-ontrack{color:#7ee39a}html[data-mode="dark"] .s-attention{color:#ffd863}
html[data-mode="dark"] .s-risk,html[data-mode="dark"] .s-critical{color:#ff8b81}html[data-mode="dark"] .s-complete{color:#7fb6ff}
html[data-mode="dark"] .s-notstarted,html[data-mode="dark"] .s-hold{color:#b8bec9}
.conf{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:600}
.conf.high{background:rgba(52,168,83,.16);color:#177a34}.conf.medium{background:rgba(251,188,5,.18);color:#8a6d00}.conf.low{background:rgba(234,67,53,.14);color:#b31c10}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;background:rgba(124,77,255,.12);color:#5b34d6;font-weight:600}
html[data-mode="dark"] .pill{color:#b79bff}
/* tables */
table.grid-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid-t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;position:sticky;top:0;background:var(--glass-strong);white-space:nowrap}
table.grid-t td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid-t tbody tr{cursor:pointer}
table.grid-t tbody tr:hover{background:rgba(66,133,244,.07)}
.tablewrap{overflow:auto;max-height:560px;border-radius:12px}
/* progress */
.bar{height:7px;border-radius:6px;background:rgba(95,99,104,.16);overflow:hidden;min-width:52px}
.bar > i{display:block;height:100%;border-radius:6px}
.mini{font-size:11px;color:var(--ink2)}
/* drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(10,15,25,.42);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(720px,94vw);background:var(--glass-strong);backdrop-filter:blur(26px) saturate(1.3);
  border-left:1px solid var(--border);box-shadow:-16px 0 50px rgba(10,15,25,.3);z-index:61;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,.61,.36,1);overflow:auto}
.drawer.show{transform:translateX(0)}
.drawer .dh{position:sticky;top:0;background:var(--glass-strong);backdrop-filter:blur(20px);padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;z-index:2}
.drawer .db{padding:18px 20px 60px}
.closex{margin-left:auto;background:var(--glass);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0;border-bottom:1px solid var(--border)}
.tabs .tab{padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent}
.tabs .tab.active{color:var(--ink);border-bottom-color:var(--hsbc-red)}
/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(10,15,25,.42);z-index:70;display:none;align-items:center;justify-content:center}
.modal-scrim.show{display:flex}
.modal{background:var(--glass-strong);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(620px,94vw);max-height:88vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 4px}
label.f{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin:10px 0 3px}
input.f,select.f,textarea.f{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--border);border-radius:9px;padding:8px 10px;outline:none}
textarea.f{min-height:60px;resize:vertical}
/* trace popover */
.trace{cursor:help;border-bottom:1px dotted var(--ink2)}
.tip{position:fixed;z-index:90;max-width:320px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{color:#ffd863}
/* misc */
.story-card{border-left:3px solid var(--blue);padding-left:12px}
.flex{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--ink2)}
.tag{display:inline-block;background:rgba(95,99,104,.12);border-radius:6px;padding:1px 7px;font-size:10.5px;margin:2px 3px 0 0}
.divider{height:1px;background:var(--border);margin:16px 0}
.attnhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.demo-flag{display:inline-flex;align-items:center;gap:6px;background:rgba(251,188,5,.14);border:1px solid rgba(251,188,5,.35);color:#8a6d00;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:600}
html[data-mode="dark"] .demo-flag{color:#ffd863}
.node{cursor:pointer}
.dragging{opacity:.5}
.agenda-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--glass);cursor:grab}
.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
.empty .big{font-size:34px;opacity:.4;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:all .25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.heat td{width:34px;height:34px;text-align:center;border-radius:6px;color:#fff;font-weight:700;font-size:12px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(95,99,104,.35);border-radius:6px}
@media (max-width:1080px){.app{grid-template-columns:1fr}nav.side{position:fixed;top:53px;bottom:0;left:0;width:238px;z-index:30;transform:translateX(-100%);transition:transform .25s}nav.side.open{transform:none}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g4,.g2{grid-template-columns:1fr}.searchbox input{width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="app">
  <header class="top">

  AG.forEach((g,i)=>{
    const aid=`AGD-${i+1}`;
    agendas.push({agendaId:aid, title:g[0], meetingDate:daysFrom(TODAY, ri(2,25)), meetingType:g[1], chairperson:g[2],
      participants:[pick(PEOPLE),pick(PEOPLE),pick(PEOPLE),pick(PEOPLE)], reportingPeriod:'2026-09',

  });

  // audit sample
  audit.push({entity:'INI-003', field:'overallStatus', prev:'On track', next:'Critical', by:'System', ts:daysFrom(TODAY,-3)+'T09:12', reason:'Critical milestone >30 days late'});
  audit.push({entity:'DEC-001', field:'decisionStatus', prev:'Draft', next:'Ready for decision', by:'A. Fischer', ts:daysFrom(TODAY,-2)+'T14:40', reason:'Evidence complete'});

  const portfolio = {

  SCC.seed = { portfolio, initiatives, milestones, risks, dependencies, actions, decisions, benefits, agendas, narratives, audit,

})();

<script>
/* ============================================================
   scc.app.js — Calculations, state, components, pages, exports.
   Business logic lives here, not inside visual markup.
   ============================================================ */
(function(){
const S = window.SCC.seed;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const TODAY = new Date('2026-09-13');
const fmtMoney=(n,cur='USD')=>{ if(n==null||isNaN(n))return '—'; const abs=Math.abs(n); let v,s; if(abs>=1e9){v=(n/1e9);s='B';} else if(abs>=1e6){v=(n/1e6);s='M';} else if(abs>=1e3){v=(n/1e3);s='K';} else {v=n;s='';} return (cur==='USD'?'$':'')+ (Math.abs(v)>=100? v.toFixed(0): v.toFixed(1)).replace(/\.0$/,'')+s; };
const fmtNum=n=> n==null?'—': n.toLocaleString('en-US');
const pct=n=> (n==null||isNaN(n))?'—': Math.round(n)+'%';
const daysBetween=(a,b)=> Math.round((new Date(b)-new Date(a))/864e5);
const fmtDate=d=> d? new Date(d).toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}):'—';

/* -------- STATE (Zustand-like tiny store) -------- */
const STORE_KEY='scc.state.v1';
let state = {
  page:'home', role:'Group Chief of Staff',
  filters:{ period:'2026-09', region:'All', country:'All', bu:'All', segment:'All', pillar:'All', type:'All', sponsor:'All', owner:'All', status:'All', decisionState:'All', riskSeverity:'All', benefitType:'All' },
  mode:'light',
  weights:{ priority:{stratAlign:25,benefit:20,client:15,reg:10,exec:10,time:10,enable:10}, risk:{schedule:20,budget:20,resource:20,dependency:20,benefit:20} },
  confFactor:{High:0.90,Medium:0.65,Low:0.35},
  data:JSON.parse(JSON.stringify({initiatives:S.initiatives, milestones:S.milestones, risks:S.risks, dependencies:S.dependencies, actions:S.actions, decisions:S.decisions, benefits:S.benefits, agendas:S.agendas, narratives:S.narratives, audit:S.audit}))
};
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({filters:state.filters,mode:state.mode,role:state.role,weights:state.weights,confFactor:state.confFactor,data:state.data})); }catch(e){} }
function restore(){ try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s){ Object.assign(state.filters,s.filters||{}); state.mode=s.mode||'light'; state.role=s.role||state.role; if(s.weights)state.weights=s.weights; if(s.confFactor)state.confFactor=s.confFactor; if(s.data)state.data=s.data; } }catch(e){} }
function resetSeed(){ localStorage.removeItem(STORE_KEY); state.data=JSON.parse(JSON.stringify({initiatives:S.initiatives, milestones:S.milestones, risks:S.risks, dependencies:S.dependencies, actions:S.actions, decisions:S.decisions, benefits:S.benefits, agendas:S.agendas, narratives:S.narratives, audit:S.audit})); toast('Reset to seeded demonstration data'); render(); }

/* -------- CALCULATIONS (separate module) -------- */
const CALC = {
  msFor:(id)=> state.data.milestones.filter(m=>m.initiativeId===id),
  risksFor:(id)=> state.data.risks.filter(r=>r.initiativeId===id),
  depsFor:(id)=> state.data.dependencies.filter(d=>d.sourceInitiativeId===id||d.targetInitiativeId===id),
  decsFor:(id)=> state.data.decisions.filter(d=>d.requestingInitiativeId===id),
  actsFor:(id)=> state.data.actions.filter(a=>a.sourceId===id),
  bensFor:(id)=> state.data.benefits.filter(b=>b.initiativeId===id),
  budgetVar:(i)=> i.approvedBudget? (i.forecastBudget-i.approvedBudget)/i.approvedBudget : 0,
  headCover:(i)=> i.requiredHeadcount? i.assignedHeadcount/i.requiredHeadcount : 1,
  benefitCover:(i)=> i.benefitTarget? i.benefitForecast/i.benefitTarget : 1,
  worstMilestoneSlip:(id)=>{ const ms=CALC.msFor(id).filter(m=>m.status!=='Complete'); return ms.length? Math.max(...ms.map(m=>m._slip||0)) : 0; },
  overdueDecision:(id)=>{ const ds=CALC.decsFor(id); let worst=0; ds.forEach(d=>{ if(!['Approved','Rejected','Conditional approval','Closed','Superseded'].includes(d.decisionStatus)){ const dd=daysBetween(d.requiredByDate,TODAY); if(dd>worst)worst=dd; } }); return worst; },
  calcStatus:(i)=>{
    const slip=CALC.worstMilestoneSlip(i.initiativeId), bv=CALC.budgetVar(i), hc=CALC.headCover(i), bc=CALC.benefitCover(i);
    const critRisk=CALC.risksFor(i.initiativeId).some(r=>r.residualScore>=16 && r.status!=='Closed');
    const overdueDec=CALC.overdueDecision(i.initiativeId);
    const depOverdue=CALC.depsFor(i.initiativeId).some(d=>d.status==='Overdue'&&d.criticality!=='Medium');
    const allComplete=CALC.msFor(i.initiativeId).every(m=>m.status==='Complete') && i.completionPercentage>=100;
    const reasons=[];
    if(allComplete) return {status:'Complete', reasons:['All mandatory milestones complete']};
    if(i.statusOverride && i.statusOverride.status==='On hold') return {status:'On hold', reasons:['Owner placed initiative on hold']};
    // Critical
    if(slip>30){reasons.push(`Critical milestone ${slip} days late`);}
    if(critRisk){reasons.push('Unmitigated critical risk (residual ≥ 16)');}
    if(bv>0.15){reasons.push(`Budget forecast ${Math.round(bv*100)}% over approved (>15%)`);}
    if(hc<0.60){reasons.push(`Headcount coverage ${Math.round(hc*100)}% (<60%)`);}
    if(overdueDec>14){reasons.push(`Leadership decision overdue by ${overdueDec} days (>14)`);}
    if(reasons.length) return {status:'Critical', reasons};
    // At risk
    if(slip>=15&&slip<=30){reasons.push(`Critical milestone ${slip} days late (15–30)`);}
    if(bv>0.08&&bv<=0.15){reasons.push(`Budget forecast ${Math.round(bv*100)}% over approved (8–15%)`);}
    if(hc>=0.60&&hc<0.75){reasons.push(`Headcount coverage ${Math.round(hc*100)}% (60–75%)`);}
    if(depOverdue){reasons.push('High-severity cross-initiative dependency overdue');}
    if(bc<0.70){reasons.push(`Benefit forecast ${Math.round(bc*100)}% of target (<70%)`);}
    if(reasons.length) return {status:'At risk', reasons};
    // Attention
    if(slip>=1&&slip<=14){reasons.push(`Milestone ${slip} days late (1–14)`);}
    if(bv>0.03&&bv<=0.08){reasons.push(`Budget forecast ${Math.round(bv*100)}% over approved (3–8%)`);}
    if(hc>=0.75&&hc<0.90){reasons.push(`Headcount coverage ${Math.round(hc*100)}% (75–90%)`);}
    if(overdueDec<=0 && CALC.decsFor(i.initiativeId).some(d=>{const dd=daysBetween(TODAY,d.requiredByDate); return dd>=0&&dd<=7 && !['Approved','Rejected','Conditional approval'].includes(d.decisionStatus);})){reasons.push('Leadership decision due within 7 days');}
    if(reasons.length) return {status:'Attention required', reasons};
    if(i.completionPercentage<=1) return {status:'Not started', reasons:['No progress recorded']};
    return {status:'On track', reasons:['No material threshold breach; budget, schedule and resources within tolerance']};
  },
  effectiveStatus:(i)=>{ if(i.statusOverride && i.statusOverride.status){ return {status:i.statusOverride.status, calc:CALC.calcStatus(i), overridden:true, override:i.statusOverride}; } const c=CALC.calcStatus(i); return {status:c.status, calc:c, overridden:false}; },
  priority:(i)=>{ const w=state.weights.priority; const parts={ 'Strategic alignment':[i._stratAlign,w.stratAlign], 'Expected benefit':[Math.min(100,Math.round(CALC.benefitCover(i)*100)),w.benefit], 'Client / market impact':[i._clientImpact,w.client], 'Regulatory urgency':[i._regUrg,w.reg], 'Executive commitment':[i._execCommit,w.exec], 'Time criticality':[i._timeCrit,w.time], 'Cross-portfolio enablement':[i._enable,w.enable] };
    let tot=0,wsum=0; Object.values(parts).forEach(([v,ww])=>{tot+=v*ww;wsum+=ww;}); return {score:Math.round(tot/wsum), parts}; },
  deliveryRisk:(i)=>{ const w=state.risk||state.weights.risk; const slip=CALC.worstMilestoneSlip(i.initiativeId); const sched=Math.min(100,Math.max(0,slip*2)); const bud=Math.min(100,Math.max(0,CALC.budgetVar(i)*400)); const res=Math.min(100,Math.max(0,(1-CALC.headCover(i))*160)); const depO=CALC.depsFor(i.initiativeId).filter(d=>d.status==='Overdue').length; const dep=Math.min(100,depO*35); const ben=Math.min(100,Math.max(0,(1-CALC.benefitCover(i))*140)); const parts={'Schedule risk':[Math.round(sched),20],'Budget risk':[Math.round(bud),20],'Resource risk':[Math.round(res),20],'Dependency risk':[Math.round(dep),20],'Benefit uncertainty':[Math.round(ben),20]}; let tot=0; Object.values(parts).forEach(([v,ww])=>tot+=v*ww); return {score:Math.round(tot/100), parts}; },
  dataQuality:(i)=>{ let score=100; const ded=[]; const req=['executiveSponsor','initiativeOwner','approvedBudget','benefitTarget']; req.forEach(f=>{ if(!i[f]){score-=5;ded.push('Missing '+f);} });
    const stale=daysBetween(i.lastUpdateDate,TODAY)>30; if(stale){score-=20;ded.push('Update stale (>30 days)');}
    if(!CALC.bensFor(i.initiativeId).some(b=>b.baselineDate)){score-=10;ded.push('Missing benefit baseline');}
    if(!CALC.bensFor(i.initiativeId).some(b=>b.financeValidated)){score-=10;ded.push('No finance-validated benefit');}
    if(CALC.msFor(i.initiativeId).length<2){score-=15;ded.push('Milestone coverage incomplete');}
    if(CALC.risksFor(i.initiativeId).length===0){score-=10;ded.push('No risks recorded');}
    if(CALC.risksFor(i.initiativeId).some(r=>!r.mitigationOwner)){score-=5;ded.push('Risk without mitigation owner');}
    return {score:Math.max(0,score), ded}; },
  quadrant:(i)=>{ const p=CALC.priority(i).score, r=CALC.deliveryRisk(i).score; if(p>=50&&r<50)return 'Protect and accelerate'; if(p>=50&&r>=50)return 'Govern closely'; if(p<50&&r<50)return 'Selective investment'; return 'Reconsider or stop'; },
  confAdjBenefit:(b)=>{ const cf=state.confFactor[b.confidence]||0.65; return b.realizedValue + b.forecastValue*cf; }
};

/* -------- FILTERS -------- */
function filtered(){
  const f=state.filters;
  return state.data.initiatives.filter(i=>{
    if(f.region!=='All' && i.region!==f.region) return false;
    if(f.country!=='All' && !(i.countries||[]).includes(f.country)) return false;
    if(f.bu!=='All' && i.businessUnit!==f.bu) return false;
    if(f.segment!=='All' && i.clientSegment!==f.segment) return false;
    if(f.pillar!=='All' && i.strategicPillar!==f.pillar) return false;
    if(f.type!=='All' && i.initiativeType!==f.type) return false;
    if(f.sponsor!=='All' && i.executiveSponsor!==f.sponsor) return false;
    if(f.owner!=='All' && i.initiativeOwner!==f.owner) return false;
    if(f.status!=='All' && CALC.effectiveStatus(i).status!==f.status) return false;
    if(f.benefitType!=='All' && i.benefitType!==f.benefitType) return false;
    return true;
  });
}
const filteredIds=()=> new Set(filtered().map(i=>i.initiativeId));

    <h2 style="margin:8px 0 2px">${d.title}</h2><div class="mini muted">${d.decisionQuestion}</div>
    <div class="mini">Owner ${d.decisionOwner} · Forum ${d.decisionForum} · Required ${fmtDate(d.requiredByDate)}</div></div><button class="closex">✕</button></div>
   <div class="db">
    <div class="card"><b>Context</b><p class="mini">${d.decisionContext}</p><b>Consequence of delay</b><p class="mini" style="color:var(--red)">${d.consequenceOfDelay}</p><div class="flex" style="gap:14px"><div class="mini">Est. delay: <b>${d.estimatedDelayImpact}</b></div><div class="mini">Financial impact: <b>${fmtMoney(d.estimatedFinancialImpact)}</b></div></div></div>

      <div class="mini"><b>+</b> ${o.advantages.join(', ')}</div><div class="mini"><b>−</b> ${o.disadvantages.join(', ')}</div>

function openAgenda(id){
  const a=state.data.agendas.find(x=>x.agendaId===id); if(!a)return;
  const total=(a.agendaItems||[]).reduce((s,it)=>s+(it.discussionTimeMinutes||0),0);
  openDrawer(`<div class="dh"><div><h2 style="margin:0 0 4px">${a.title}</h2><div class="mini muted">${a.meetingType} · ${fmtDate(a.meetingDate)} · Chair ${a.chairperson}</div>
    <div class="mini">Objectives: ${a.objectives.join('; ')}</div>
    <div class="mini" style="${total>a.durationMinutes?'color:var(--red)':''}">Time: ${total} / ${a.durationMinutes} min ${total>a.durationMinutes?'⚑ over':''}</div></div><button class="closex">✕</button></div>
   <div class="db"><div id="agItems">${(a.agendaItems||[]).map((it,ix)=>agendaItemHtml(it,ix)).join('')||'<div class="mini muted">No items yet — generate from portfolio on the agenda page</div>'}</div></div>`);

function agendaItemHtml(it,ix){ return `<div class="agenda-item" draggable="true" data-ix="${ix}"><div class="flex between"><b>${it.sequence}. ${it.title}</b><span class="tag">${it.purpose}</span></div><div class="mini muted">${it.presenter} · ${it.discussionTimeMinutes} min · ${it.linkedEntityType||''} ${it.linkedEntityId||''}</div><div class="mini">${it.talkingPoints||''}</div></div>`; }

function genPortfolioNarrative(inits){
  const crit=inits.filter(i=>CALC.effectiveStatus(i).status==='Critical').length;
  const dec=state.data.decisions.filter(d=>d._overdue).length;
  const ben=inits.reduce((a,i)=>a+i.benefitRealized,0);
  return `<p><b>What we set out to achieve.</b> The portfolio pursues ${inits.length} initiatives across ${[...new Set(inits.map(i=>i.region))].length} regions, anchored on client growth, digital wealth, regulatory resilience and cost transformation.</p>
  <p><b>What progressed.</b> ${inits.filter(i=>CALC.effectiveStatus(i).status==='On track').length} initiatives remain on track and ${fmtMoney(ben)} of benefit has been realized to date.</p>
  <p><b>What is getting in the way.</b> ${crit} initiative${crit===1?'':'s'} ${crit===1?'is':'are'} critical, primarily driven by milestone slippage, resource coverage gaps and unresolved decisions. ${dec} leadership decision${dec===1?'':'s'} ${dec===1?'is':'are'} overdue.</p>
  <p><b>What leadership must decide.</b> Priority decisions concern data-residency for the APAC pilot, budget treatment for cloud simplification, and compliance capacity funding.</p>
  <p><b>What happens next.</b> Focus the next cycle on clearing overdue decisions and closing the specialist-skill gap that threatens three milestones.</p>`;
}
function genRibbon(inits){
  const critDec=state.data.decisions.filter(d=>d._overdue).length;
  const budOk=inits.reduce((a,i)=>a+CALC.budgetVar(i),0)/inits.length < 0.05;
  return `The portfolio remains strategically aligned, but execution confidence declined this month because ${critDec} leadership decision${critDec===1?'':'s'} remain unresolved. Budget remains ${budOk?'within tolerance':'under pressure'}, while a shortage of compliance and data-engineering capacity now threatens several milestones.`;
}
function genNarrativeSections(inits){
  const crit=inits.filter(i=>CALC.effectiveStatus(i).status==='Critical');
  const attn=inits.filter(i=>CALC.effectiveStatus(i).status==='Attention required');
  const overdueDec=state.data.decisions.filter(d=>d._overdue);
  const ben=inits.reduce((a,i)=>a+i.benefitRealized,0), benT=inits.reduce((a,i)=>a+i.benefitTarget,0);
  const s=[];
  s.push({title:'1. Executive summary', bullets:[{text:`${inits.length} initiatives are in scope; ${inits.filter(i=>CALC.effectiveStatus(i).status==='On track').length} on track, ${crit.length} critical. ${overdueDec.length} decisions overdue.`,sources:['Portfolio'],conf:'High'}]});
  s.push({title:'2. Portfolio health', bullets:[{text:`Aggregate forecast budget is ${fmtMoney(inits.reduce((a,i)=>a+i.forecastBudget,0))} against approved ${fmtMoney(inits.reduce((a,i)=>a+i.approvedBudget,0))}.`,sources:['Budget'],conf:'High'}]});
  s.push({title:'3. Initiatives needing intervention', bullets:crit.map(i=>({text:`${i.title} is critical: ${CALC.calcStatus(i).reasons[0]}.`,sources:[i.initiativeId],conf:'High'})).concat(attn.slice(0,3).map(i=>({text:`${i.title} needs attention: ${CALC.calcStatus(i).reasons[0]||'Reason not provided.'}`,sources:[i.initiativeId],conf:'Medium'})))});
  s.push({title:'4. Decisions required', bullets:overdueDec.slice(0,5).map(d=>({text:`${d.title} (${initShort(d.requestingInitiativeId)}) is overdue since ${fmtDate(d.requiredByDate)}. ${d.consequenceOfDelay}`,sources:[d.decisionId],conf:'High'}))});
  s.push({title:'5. Benefits realized', bullets:[{text:`Realized benefit is ${fmtMoney(ben)} of a ${fmtMoney(benT)} target (${pct(ben/benT*100)}). Forecast is not stated as realized.`,sources:['Benefits'],conf:'Medium'}]});
  s.push({title:'6. Priorities for next month', bullets:[{text:`Clear overdue decisions, close specialist-skill gaps, and confirm benefit baselines for finance validation.`,sources:['Portfolio'],conf:'Medium'}]});
  return s;
}
function suggestAgenda(){
  const items=[]; let seq=1;
  const add=(title,purpose,entityType,entityId,mins,tp)=>items.push({agendaItemId:'AI-'+seq,sequence:seq++,title,purpose,presenter:'CoS',discussionTimeMinutes:mins,linkedEntityType:entityType,linkedEntityId:entityId,talkingPoints:tp,decisionRequired:purpose==='Decide',outcome:'',followUpActions:[]});
  state.data.decisions.filter(d=>d._overdue).slice(0,3).forEach(d=>add('Overdue decision: '+d.title,'Decide','Decision',d.decisionId,10,d.consequenceOfDelay));
  state.data.risks.filter(r=>r.residualScore>=16).slice(0,2).forEach(r=>add('Critical risk: '+r.title,'Escalate','Risk',r.riskId,8,'Residual score '+r.residualScore));
  state.data.dependencies.filter(d=>d.status==='Overdue'&&d.criticality==='Critical').slice(0,2).forEach(d=>add('Cross-portfolio dependency: '+d.title,'Discuss','Dependency',d.dependencyId,6,'Overdue handover'));
  add('Benefits trajectory review','Inform','Benefit',null,6,'Realized vs forecast update');
  add('Recognition — initiatives ahead of plan','Inform',null,null,4,'Recognize strong delivery');
  return items;
}

/* ============================================================
   EXPORTS
   ============================================================ */
function toCSV(rows){ return rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n'); }
function download(name,content,type='text/csv'){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function exportPortfolio(){ const inits=filtered(); const rows=[['Initiative','Region','Pillar','Sponsor','Owner','Priority','DeliveryRisk','Status','Approved','Forecast','Actual','BenefitTarget','BenefitForecast','BenefitRealized','Required HC','Assigned HC']]; inits.forEach(i=>rows.push([i.title,i.region,i.strategicPillar,i.executiveSponsor,i.initiativeOwner,CALC.priority(i).score,CALC.deliveryRisk(i).score,CALC.effectiveStatus(i).status,i.approvedBudget,i.forecastBudget,i.actualSpend,i.benefitTarget,i.benefitForecast,i.benefitRealized,i.requiredHeadcount,i.assignedHeadcount])); download('portfolio.csv',toCSV(rows)); toast('Portfolio CSV exported'); }
function exportRisk(){ const ids=filteredIds(); const rows=[['Risk','Initiative','Category','Probability','Impact','Inherent','Residual','Trend','MitigationOwner','Due','ExecAttention']]; state.data.risks.filter(r=>ids.has(r.initiativeId)).forEach(r=>rows.push([r.title,initShort(r.initiativeId),r.category,r.probability,r.impact,r.inherentScore,r.residualScore,r.trend,r.mitigationOwner,r.mitigationDueDate,r.executiveAttentionRequired])); download('risk-dependency.csv',toCSV(rows)); toast('Risk CSV exported'); }
function exportDecisions(){ const rows=[['Decision','Initiative','Owner','Forum','Required','Status','Recommended','FinalDecision','FinancialImpact','ReviewDate']]; state.data.decisions.filter(d=>inFilter(d.requestingInitiativeId)).forEach(d=>rows.push([d.title,initShort(d.requestingInitiativeId),d.decisionOwner,d.decisionForum,d.requiredByDate,d.decisionStatus,(d.options.find(o=>o.optionId===d.recommendedOptionId)||{}).title,d.finalDecision||'',d.estimatedFinancialImpact,d.reviewDate||''])); download('decision-log.csv',toCSV(rows)); toast('Decision log exported'); }
function exportBenefits(){ const ids=filteredIds(); const rows=[['Benefit','Initiative','Type','Target','Forecast','Realized','Confidence','FinanceValidated']]; state.data.benefits.filter(b=>ids.has(b.initiativeId)).forEach(b=>rows.push([b.title,initShort(b.initiativeId),b.benefitType,b.targetValue,b.forecastValue,b.realizedValue,b.confidence,b.financeValidated])); download('benefits.csv',toCSV(rows)); toast('Benefits CSV exported'); }
function exportJSON(){ download('scc-backup.json',JSON.stringify(state.data,null,2),'application/json'); toast('JSON backup exported'); }
function exportNarrativeOutline(inits){ const secs=genNarrativeSections(inits); let out='STRATEGIC COMMAND CENTER — EXECUTIVE STEERING OUTLINE\nPeriod '+state.filters.period+'\n(Fictional demonstration data)\n\n'; secs.forEach(s=>{ out+=s.title+'\n'; s.bullets.forEach(b=>out+='  • '+b.text+'   ['+b.sources.join(', ')+']\n'); out+='\n'; }); download('steering-outline.txt',out,'text/plain'); toast('Steering outline exported'); }
function exportMenu(){ openModal(`<div class="flex between"><h3>Export</h3><button class="closex">✕</button></div><p class="mini muted">Exports reflect current filters. Seeded values are fictional demonstration data.</p>
  <div class="grid g2" style="margin-top:8px">
   ${[['Portfolio CSV','exp_portfolio'],['Risk & dependency CSV','exp_risk'],['Decision log CSV','exp_dec'],['Benefits CSV','exp_ben'],['Executive steering outline','exp_nar'],['JSON data backup','exp_json'],['Print executive dashboard','exp_print']].map(b=>`<button class="btn ghost" id="${b[1]}">${b[0]}</button>`).join('')}
  </div>`);
  $('#exp_portfolio').onclick=()=>{exportPortfolio();closeModal();}; $('#exp_risk').onclick=()=>{exportRisk();closeModal();}; $('#exp_dec').onclick=()=>{exportDecisions();closeModal();}; $('#exp_ben').onclick=()=>{exportBenefits();closeModal();}; $('#exp_nar').onclick=()=>{exportNarrativeOutline(filtered());closeModal();}; $('#exp_json').onclick=()=>{exportJSON();closeModal();}; $('#exp_print').onclick=()=>{closeModal();window.print();};
}

/* ============================================================
   SEARCH & NOTIFICATIONS
   ============================================================ */
function runSearch(q){
  const res=$('#searchResults'); if(!q){res.classList.remove('show');return;}
  q=q.toLowerCase(); const groups={Initiatives:[],Decisions:[],Risks:[],Dependencies:[],Benefits:[],Agendas:[]};
  state.data.initiatives.filter(i=>(i.title+i.executiveSponsor+i.initiativeOwner+i.region).toLowerCase().includes(q)).slice(0,5).forEach(i=>groups.Initiatives.push([i.title,()=>openInitiative(i.initiativeId)]));
  state.data.decisions.filter(d=>(d.title+d.decisionQuestion).toLowerCase().includes(q)).slice(0,4).forEach(d=>groups.Decisions.push([d.title,()=>openDecision(d.decisionId)]));
  state.data.risks.filter(r=>r.title.toLowerCase().includes(q)).slice(0,4).forEach(r=>groups.Risks.push([r.title+' — '+initShort(r.initiativeId),()=>openInitiative(r.initiativeId)]));
  state.data.dependencies.filter(d=>d.title.toLowerCase().includes(q)).slice(0,3).forEach(d=>groups.Dependencies.push([d.title,()=>{state.page='risk';render();}]));
  state.data.benefits.filter(b=>b.title.toLowerCase().includes(q)).slice(0,3).forEach(b=>groups.Benefits.push([b.title+' — '+initShort(b.initiativeId),()=>openInitiative(b.initiativeId)]));
  state.data.agendas.filter(a=>a.title.toLowerCase().includes(q)).slice(0,3).forEach(a=>groups.Agendas.push([a.title,()=>openAgenda(a.agendaId)]));
  res.innerHTML=''; let any=false;
  Object.entries(groups).forEach(([g,items])=>{ if(!items.length)return; any=true; res.appendChild(el('div','grp',g)); items.forEach(([label,fn])=>{ const r=el('div','row',label); r.onclick=()=>{res.classList.remove('show');$('#globalSearch').value='';fn();}; res.appendChild(r); }); });
  if(!any)res.innerHTML='<div class="row mini muted">No matches</div>';
  res.classList.add('show');
}
function openNotifications(){
  const notes=[];
  state.data.decisions.filter(d=>d._overdue).forEach(d=>notes.push(['⚖','Decision overdue',d.title,'var(--red)']));
  state.data.decisions.filter(d=>{const dd=daysBetween(TODAY,d.requiredByDate);return dd>=0&&dd<=7;}).forEach(d=>notes.push(['⚖','Decision due soon',d.title,'var(--decision-blue)']));
  state.data.risks.filter(r=>r.trend==='Increasing'&&r.residualScore>=12).forEach(r=>notes.push(['⚠','Risk increased',r.title+' — '+initShort(r.initiativeId),'var(--amber)']));
  state.data.dependencies.filter(d=>d.status==='Overdue').slice(0,5).forEach(d=>notes.push(['🔗','Dependency late',d.title,'var(--amber)']));
  state.data.actions.filter(a=>a.status==='Overdue').slice(0,5).forEach(a=>notes.push(['✔','Action overdue',a.title,'var(--red)']));
  state.data.initiatives.filter(i=>CALC.budgetVar(i)>0.15).forEach(i=>notes.push(['▤','Budget threshold breached',i.shortTitle,'var(--red)']));
  state.data.initiatives.filter(i=>daysBetween(i.lastUpdateDate,TODAY)>30).slice(0,5).forEach(i=>notes.push(['◑','Initiative update overdue',i.shortTitle,'var(--ink2)']));
  openModal(`<div class="flex between"><h3>Notifications</h3><button class="closex">✕</button></div><div style="max-height:60vh;overflow:auto;margin-top:8px">${notes.map(n=>`<div class="flex" style="gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:16px">${n[0]}</span><div><b style="color:${n[3]}">${n[1]}</b><div class="mini">${n[2]}</div></div></div>`).join('')}</div>`);
}
function decStatusBadge(s){ const map={'Approved':'s-ontrack','Conditional approval':'s-ontrack','Ready for decision':'s-attention','Evidence gathering':'s-notstarted','Draft':'s-notstarted','Deferred':'s-hold','Rejected':'s-risk','Under review':'s-attention','Superseded':'s-hold','Closed':'s-complete'}; return `<span class="badge-status ${map[s]||'s-notstarted'}"><span class="sd"></span>${s}</span>`; }
function portfolioStatus(inits){ const crit=inits.filter(i=>CALC.effectiveStatus(i).status==='Critical').length; const risk=inits.filter(i=>CALC.effectiveStatus(i).status==='At risk').length; if(crit>=2)return statusBadge('Critical'); if(crit+risk>=3)return statusBadge('At risk'); if(risk)return statusBadge('Attention required'); return statusBadge('On track'); }

/* ============================================================
   AGENDA BUILDER (drag reorder)
   ============================================================ */
function renderAgendaBuilder(a){
  const box=$('#agendaBuild'); if(!box)return;
  const total=(a.agendaItems||[]).reduce((s,it)=>s+(it.discussionTimeMinutes||0),0);
  box.innerHTML=`<div class="flex between"><b>${a.title}</b><span class="mini ${total>a.durationMinutes?'':''}" style="${total>a.durationMinutes?'color:var(--red)':''}">${total}/${a.durationMinutes} min ${total>a.durationMinutes?'⚑ over':'✓'}</span></div>
    <div class="mini muted" style="margin:4px 0 10px">${a.meetingType} · ${fmtDate(a.meetingDate)} · Chair ${a.chairperson}</div>
    <div id="agBuildItems">${(a.agendaItems||[]).map((it,ix)=>agendaItemHtml(it,ix)).join('')||'<div class="mini muted">Click “Generate suggested agenda”.</div>'}</div>`;
  // drag reorder
  const cont=$('#agBuildItems'); if(!cont)return; let dragIx=null;
  $$('.agenda-item',cont).forEach(item=>{
    item.addEventListener('dragstart',()=>{dragIx=+item.dataset.ix;item.classList.add('dragging');});
    item.addEventListener('dragend',()=>item.classList.remove('dragging'));
    item.addEventListener('dragover',e=>{e.preventDefault();});
    item.addEventListener('drop',e=>{e.preventDefault(); const dropIx=+item.dataset.ix; const arr=a.agendaItems; const [m]=arr.splice(dragIx,1); arr.splice(dropIx,0,m); arr.forEach((it,i)=>it.sequence=i+1); persist(); renderAgendaBuilder(a);});
  });
}

/* ============================================================
   ROUTER / RENDER
   ============================================================ */
function render(){
  renderNav(); renderFilters();
  const root=$('#pageRoot'); root.innerHTML='';
  const page=(PAGES[state.page]||PAGES.home)();
  root.appendChild(page);
  // wire generic openers / exports / converts
  $$('[data-open]',root).forEach(e=>e.addEventListener('click',ev=>{ ev.stopPropagation(); const id=e.dataset.open; if(id.startsWith('DEC'))openDecision(id); else if(id.startsWith('INI'))openInitiative(id); }));
  $$('.node[data-open]',root).forEach(e=>e.addEventListener('click',()=>{ const id=e.dataset.open; if(id.startsWith('DEC'))openDecision(id);else openInitiative(id); }));
  $$('[data-export]',root).forEach(e=>e.onclick=(ev)=>{ev.stopPropagation(); ({portfolio:exportPortfolio,risk:exportRisk})[e.dataset.export]?.();});
  $$('[data-convert]',root).forEach(e=>e.onclick=(ev)=>{ev.stopPropagation(); convertRisk(e.dataset.convert);});
  document.documentElement.setAttribute('data-mode',state.mode);
  persist();
}
function convertRisk(rid){ const r=state.data.risks.find(x=>x.riskId===rid); if(!r)return; const did='DEC-R'+(state.data.decisions.length+1); const ini=state.data.initiatives.find(i=>i.initiativeId===r.initiativeId);
  state.data.decisions.push({decisionId:did,title:'Risk escalation: '+r.title,decisionQuestion:'How should we respond to '+r.title+'?',decisionContext:'Converted from risk '+rid,requestingInitiativeId:r.initiativeId,requestedBy:r.mitigationOwner,decisionOwner:ini.executiveSponsor,decisionForum:'Risk Committee',requiredByDate:r.mitigationDueDate,decisionStatus:'Draft',urgency:r.residualScore>=16?'Critical':'High',consequenceOfDelay:'Risk may materialise.',estimatedDelayImpact:'',estimatedFinancialImpact:0,options:[{optionId:did+'-O1',title:'Accept residual risk',description:'',advantages:['No spend'],disadvantages:['Exposure remains'],costImpact:0,headcountImpact:0,scheduleImpact:'',riskImpact:'Increases',benefitImpact:'',implementationComplexity:'Low',reversibility:'High',confidence:'Medium',supportingEvidence:''},{optionId:did+'-O2',title:'Fund additional mitigation',description:'',advantages:['Reduces risk'],disadvantages:['Cost'],costImpact:500000,headcountImpact:3,scheduleImpact:'',riskImpact:'Reduces',benefitImpact:'',implementationComplexity:'Medium',reversibility:'Medium',confidence:'High',supportingEvidence:''}],recommendedOptionId:did+'-O2',recommendationRationale:'Mitigation preferred given residual score.',assumptions:'',evidence:'Risk record '+rid,decisionDate:null,finalDecision:null,finalRationale:null,conditions:null,followUpActions:[],reviewDate:null,benefitHypothesis:'',benefitRealized:0,createdAt:new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString().slice(0,10),region:r.region,_overdue:new Date(r.mitigationDueDate)<TODAY});
  r.linkedDecisionId=did; ini.linkedDecisionIds.push(did); addAudit(r.initiativeId,'risk→decision','—',did,'Risk converted to decision request'); persist(); toast('Risk converted to decision request'); openDecision(did); render();
}

/* ============================================================
   HEADER WIRING
   ============================================================ */
$('#periodSel').innerHTML=S.meta.PERIODS.map(p=>`<option ${p==='2026-09'?'selected':''}>${p}</option>`).join('');
$('#periodSel').onchange=e=>{state.filters.period=e.target.value;persist();render();};
$('#createSel').onchange=e=>{ if(e.target.value){createModal(e.target.value); e.target.value='';} };
$('#exportBtn').onclick=exportMenu;
$('#notifBtn').onclick=openNotifications;
$('#modeBtn').onclick=()=>{ state.mode=state.mode==='light'?'dark':'light'; document.documentElement.setAttribute('data-mode',state.mode); persist(); };
$('#globalSearch').addEventListener('input',e=>runSearch(e.target.value));
document.addEventListener('click',e=>{ if(!e.target.closest('.searchbox'))$('#searchResults').classList.remove('show'); });
$('#navToggle').onclick=()=>$('#sideNav').classList.toggle('open');
function checkMobile(){ $('#navToggle').style.display=innerWidth<=1080?'flex':'none'; }
window.addEventListener('resize',checkMobile);

// user profile
$('#userName').textContent='K Shreenath';
$('#userRole').textContent=state.role;

/* ============================================================
   INIT
   ============================================================ */
restore();
document.documentElement.setAttribute('data-mode',state.mode);
$('#userRole').textContent=state.role;
checkMobile();
render();
})();
